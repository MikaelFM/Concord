<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
<title>Concord - sobreposição</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 600 14px/1.3 "Segoe UI", "Noto Sans", Arial, sans-serif; color: #fff; user-select: none; }
  #root { position: fixed; inset: 12px; display: flex; flex-direction: column; gap: 10px; }
  body.right #root { align-items: flex-end; }
  body.bottom #root { justify-content: flex-end; }
  .card { display: inline-flex; flex-direction: column; gap: 6px; padding: 4px; }
  .av, .pill, .chan { box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .row { display: flex; align-items: center; gap: 8px; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: #5865f2 center/cover; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; box-shadow: 0 0 0 3px transparent; transition: box-shadow .1s; }
  .row.speaking .av { box-shadow: 0 0 0 3px #23a55a; }
  .pill { display: flex; align-items: center; gap: 6px; background: rgba(15,17,28,.82); border-radius: 999px; padding: 4px 10px; max-width: 220px; }
  .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.speaking .pill { color: #fff; }
  .row:not(.speaking) .pill { color: #dcdde6; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic { color: #f23f43; display: flex; gap: 2px; }
  .ic.mod svg { background: #f23f43; color: #fff; border-radius: 4px; padding: 1px; }
  .live { background: #f23f43; color: #fff; font-size: 10px; border-radius: 4px; padding: 0 4px; }
  .foot { display: flex; align-items: center; gap: 6px; }
  .chan { background: rgba(15,17,28,.85); border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
  .msgs { display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; background: rgba(15,17,28,.85); border-radius: 12px; padding: 8px 10px; animation: in .2s ease; transition: opacity .6s; }
  .msg.out { opacity: 0; }
  .msg .av { width: 26px; height: 26px; font-size: 10px; }
  .msg b { display: block; font-size: 13px; }
  .msg p { margin: 2px 0 0; font-weight: 400; font-size: 14px; word-wrap: break-word; overflow-wrap: anywhere; max-height: 5.4em; overflow: hidden; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .where { color: rgba(255,255,255,.6); font-weight: 400; }
  .msg.other { border-left: 3px solid #5865f2; }
  body.editing { -webkit-app-region: drag; cursor: move; }
  body.editing #root { outline: 2px dashed #5865f2; outline-offset: -2px; border-radius: 14px; background: rgba(88,101,242,.12); inset: 0; padding: 12px; }
  .edit-bar { display: none; }
  body.editing .edit-bar { display: flex; flex-direction: column; gap: 8px; position: fixed; left: 12px; right: 12px; bottom: 12px; background: rgba(15,17,28,.95); border-radius: 12px; padding: 12px; font-weight: 400; font-size: 13px; }
  .edit-bar b { font-size: 14px; }
  .edit-bar button { -webkit-app-region: no-drag; background: #5865f2; color: #fff; border: 0; border-radius: 8px; padding: 9px; font: 600 14px "Segoe UI", Arial, sans-serif; cursor: pointer; }
  .edit-bar button:hover { background: #4752c4; }
  .hint { font-size: 11px; font-weight: 400; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="root"><div class="card" id="card" hidden></div><div class="msgs" id="msgs"></div></div>
<div class="edit-bar"><b>Arraste para onde quiser</b><span>Clique e segure em qualquer lugar desta área para mover a sobreposição.</span><button type="button" id="editDone">Pronto, salvar posição</button></div>
<script>
  const ICON = { micOff: `<svg viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M16.95 16.95A7 7 0 0 1 5 12v-2"/><path d="M18.89 13.23A7 7 0 0 0 19 12v-2"/><path d="m2 2 20 20"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/></svg>`, deafOff: `<svg viewBox="0 0 24 24"><path d="M21 14h-1.343"/><path d="M9.128 3.47A9 9 0 0 1 21 12v3.343"/><path d="m2 2 20 20"/><path d="M20.414 20.414A2 2 0 0 1 19 21h-1a2 2 0 0 1-2-2v-3"/><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 2.636-6.364"/></svg>`, speaker: `<svg viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>`, cam: `<svg viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>` };
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (n) => (n || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
  const av = (u) => `<div class="av" style="${u.avatar ? `background-image:url('${esc(u.avatar)}')` : `background-color:${esc(u.color || '#5865f2')}`}">${u.avatar ? '' : esc(initials(u.name))}</div>`;
  let opts = { showMsgs: true, scale: 1 };
  let render = null;
  const DEMO = { title: 'Sala de voz', pos: 'top-left', showMsgs: true, scale: 1, members: [{ name: 'Você', color: '#5865f2', speaking: true }, { name: 'Amigo', color: '#e91e63', muted: true }, { name: 'Outro amigo', color: '#3ba55c' }] };
  if (window.overlay.onEdit) window.overlay.onEdit((d) => {
    document.body.classList.toggle('editing', d.on);
    if (d.on) { render(d.state || DEMO); document.body.classList.remove('right', 'bottom'); }
  });
  document.getElementById('editDone').addEventListener('click', () => window.overlay.editDone());
  window.overlay.onState((st) => render(st));
  render = (st) => {
    if (!st) { $('card').hidden = true; return; }
    opts = st;
    const editing = document.body.classList.contains('editing');
    document.body.className = editing || st.pos === 'custom' ? '' : (st.pos || 'top-left').split('-').join(' ');
    if (editing) document.body.classList.add('editing');
    document.body.style.zoom = st.scale || 1;
    $('root').style.opacity = st.opacity == null ? 1 : Math.min(1, Math.max(0.2, st.opacity));
    const rows = st.members.map((u) => `<div class="row${u.speaking ? ' speaking' : ''}">${av(u)}<div class="pill"><span>${esc(u.name)}</span>${u.live ? '<b class="live">AO VIVO</b>' : ''}${u.camera ? ICON.cam : ''}${u.smuted ? `<span class="ic mod">${ICON.micOff}</span>` : u.muted ? `<span class="ic">${ICON.micOff}</span>` : ''}${u.deafened ? `<span class="ic${u.sdeaf ? ' mod' : ''}">${ICON.deafOff}</span>` : ''}</div></div>`).join('');
    $('card').innerHTML = rows + `<div class="foot"><div class="chan">${ICON.speaker}<span>${esc(st.title)}</span></div></div>`;
    $('card').hidden = false;
    $('msgs').hidden = !st.showMsgs;
  };
  window.overlay.onMessage((m) => {
    if (!opts.showMsgs) return;
    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = `${av(m)}<div><b style="color:${esc(m.nameColor || '#fff')}">${esc(m.name)}${m.where ? `<span class="where"> em ${esc(m.where)}</span>` : ''}</b><p>${esc(m.text)}</p></div>`;
    if (m.where) el.classList.add('other');
    const box = $('msgs');
    if (document.body.classList.contains('bottom')) box.prepend(el); else box.append(el);
    while (box.children.length > 5) (document.body.classList.contains('bottom') ? box.lastElementChild : box.firstElementChild).remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, 12000);
  });
</script>
</body>
</html>
