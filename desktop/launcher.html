<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Concord</title>
  <style>
    :root { --accent: #5865f2; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.4 "Segoe UI", "Noto Sans", Arial, sans-serif; color: #dbdee1; display: grid; place-items: center; padding: 16px;
      background: #0b0d17;
    }
    .card { width: 100%; max-width: 440px; background: #161a2e; border: 1px solid #20253f; border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden; }
    header { padding: 28px 32px 8px; text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 12px; }
    .logo svg, .logo img { width: 100%; height: 100%; display: block; }
    h1 { margin: 0 0 4px; color: #f2f3f5; font-size: 24px; }
    header p { margin: 0; color: #b5bac1; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px 32px 32px; }
    .box { background: #131628; border: 1px solid #20253f; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .box h2 { margin: 0 0 6px; font-size: 17px; color: #f2f3f5; display: flex; align-items: center; gap: 8px; }
    .box p { margin: 0 0 16px; color: #949ba4; font-size: 14px; flex: 1; }
    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #b5bac1; margin-bottom: 6px; }
    input { width: 100%; background: #0f1224; border: 1px solid #20253f; border-radius: 8px; padding: 10px; color: #dbdee1; font: inherit; outline: 0; margin-bottom: 12px; }
    input:focus { box-shadow: 0 0 0 2px var(--accent); }
    button { font: inherit; border: 0; cursor: pointer; border-radius: 8px; padding: 11px; font-weight: 600; color: #fff; width: 100%; }
    .primary { background: var(--accent); }
    .primary:hover { background: #4752c4; }
    .green { background: #23a55a; }
    .green:hover { background: #1a8b4a; }
    button:disabled { opacity: .6; cursor: wait; }
    .recent { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
    .recent button { width: auto; padding: 4px 10px; background: #252b4d; font-weight: 500; font-size: 13px; color: #dbdee1; }
    .recent button:hover { background: #2f3660; }
    .error { margin: 0 32px; padding: 10px 14px; border-radius: 6px; background: rgba(242,63,67,.15); border: 1px solid #f23f43; color: #ffb3b5; font-size: 14px; }
    .error[hidden] { display: none; }
    .ver { color: #8b91b4; margin-bottom: 4px; font-weight: 600; }
    .remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -12px 32px 14px; font-size: 14px; color: #b5bac1; text-transform: none; font-weight: 500; cursor: pointer; }
    .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .main { padding: 20px 32px 8px; display: flex; flex-direction: column; gap: 14px; }
    .main > .primary { padding: 13px; }
    details { color: #b5bac1; font-size: 14px; }
    summary { cursor: pointer; text-align: center; color: #949ba4; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary:hover { color: #dbdee1; text-decoration: underline; }
    details form { margin-top: 12px; }
    .secondary { background: #252b4d; }
    .secondary:hover { background: #2f3660; }
    .error { margin: 12px 32px 0; }
    footer { padding: 0 32px 24px; color: #6d6f78; font-size: 12px; text-align: center; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo"><img class="logo-svg" src="icon.png" alt="Concord"></div>
      <h1>Concord</h1>
      <p id="tagline">Converse, fale e compartilhe a tela com a galera.</p>
    </header>
    <div class="error" id="error" hidden></div>
    <div class="main">
      <button class="primary" id="retry" hidden>Tentar de novo</button>
      <details id="other">
        <summary>Usar outro endereço</summary>
        <form id="joinForm">
          <label for="address">Endereço do servidor</label>
          <input id="address" placeholder="exemplo.com ou 123.45.67.89:3000" autocomplete="off">
          <button class="secondary" type="submit">Entrar</button>
        </form>
      </details>
    </div>
    <footer><div id="ver" class="ver"></div></footer>
  </div>
  <script>
    const d = window.desktop;
    const $ = (id) => document.getElementById(id);
    const showError = (msg) => { $('error').textContent = msg; $('error').hidden = false; };
    const err = new URLSearchParams(location.search).get('erro');
    if (err) showError(err);
    if (d.version) d.version().then((v) => { $('ver').textContent = 'Concord ' + v; });
    d.config().then((cfg) => {
      if (cfg.official) {
        $('retry').hidden = false;
        if (!err) { $('tagline').textContent = 'Conectando…'; d.retry(); }
      } else {
        // ainda sem servidor oficial configurado: mostra direto o campo de endereço
        $('other').open = true;
        $('other').querySelector('summary').hidden = true;
      }
      const last = cfg.auto && cfg.auto.url;
      if (last) $('address').value = new URL(last).host;
    });
    $('retry').onclick = async () => {
      $('retry').disabled = true; $('retry').textContent = 'Conectando…';
      const r = await d.retry();
      if (!r.ok) { showError(r.error); $('retry').disabled = false; $('retry').textContent = 'Tentar de novo'; }
    };
    $('joinForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      const r = await d.join($('address').value);
      if (!r.ok) { showError(r.error); btn.disabled = false; }
    };
  </script>
</body>
</html>
